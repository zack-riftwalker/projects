  function slashFrame(i, R, cols) {
    const N = R * 2 + 8, p = G.pix(N, N), cx = 3, cy = N / 2;
    const win = [[-82, 0], [-64, 64], [28, 84]][i];
    const maxTh = [5.2, 7, 2.6][i];
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const dx = x + 0.5 - cx, dy = y + 0.5 - cy, d = Math.hypot(dx, dy);
      const a = (Math.atan2(dy, dx) * 180) / Math.PI;
      if (a < win[0] || a > win[1]) continue;
      const tt = (a - win[0]) / (win[1] - win[0]);
      const th = Math.pow(Math.sin(Math.PI * tt), 0.7) * maxTh, r = R - (1 - Math.sin(Math.PI * tt)) * 2;
      if (d <= r && d >= r - th) {
        const edge = r - d;
        p.px(x, y, i === 2 ? cols[1] : edge < 1.6 ? cols[0] : edge < th * 0.62 ? cols[1] : cols[2]);
      }
    }
    return p.c;
  }

  }

    moveX(e, dx) {

    renderStatic() {
      const L = (this.layer = G.makeCanvas(this.pw, this.ph)), g = L.g, w = this.world;
      const isS = (tx, ty) => { const t = this.tile(tx, ty); return t === SOLID; };
      for (let ty = 0; ty < this.h; ty++) for (let tx = 0; tx < this.w; tx++) {

        } else if (t === ONEWAY) G.drawOneway(g, w, px, py, tx, { l: this.tile(tx - 1, ty) === ONEWAY || isS(tx - 1, ty), r: this.tile(tx + 1, ty) === ONEWAY || isS(tx + 1, ty) });
        else if (t === SPIKE_U) G.drawSpikes(g, px, py, false);
        else if (t === SPIKE_D) G.drawSpikes(g, px, py, true);

    reserved(tx, ty) {

    // ---------- effects ----------
    shake(a) { this.trauma = Math.min(1, this.trauma + a); }

    }
    burst(x, y, n, cols, spd, grav, o) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, s = spd * (0.3 + Math.random() * 0.8);

      }
    }
    dust(x, y, n, dir) {

      this.burst(x, y, Math.round(size * 0.8), cols, size * 5, 120, { glow: 1 });

    }

    // ---------- camera ----------
    camP() { const p = this.player; return (p.dead && this.partner && !this.partner.dead) ? this.partner : p; }
    camTarget() {

      if (this.cam.lock) { tx = this.cam.lock.x; ty = this.cam.lock.y; }

    }

    updateCam(dt) {

    }

    // ---------- update ----------
    update(dt) {

      this.trauma = Math.max(0, this.trauma - dt * 2.2);
      if (this.flash > 0) this.flash = Math.max(0, this.flash - dt * 3);
      if (this.hitstop > 0) { this.hitstop -= dt; return; }
      this.time += dt;
      const p = this.player;

      // blinking blocks
      const ph = Math.floor(this.time / this.blinkPeriod) % 2;
      if (ph !== this.blinkPhase) {

        if (this.hasBlink) {
          const want = ph === 0 ? BLINK_A : BLINK_B;
          for (const q of this.players()) {
            const x0 = Math.floor(q.x / T), x1 = Math.floor((q.x + q.w) / T), y0 = Math.floor(q.y / T), y1 = Math.floor((q.y + q.h) / T);
            for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (this.tile(tx, ty) === want) this.blinkHold.add(ty * this.w + tx);
          }

      }

        if (this.rising && ps.length && !this.frozen) {

    }

    interact() {
      const p = this.player;
      if (p.dead || p.gone) return;
      // claw
      if (p.atkT > 0 && p.atkLive) {
        const box = p.atkBox();
        for (const e of this.ents) {
          if (e.dead || e[p.hitKey] === p.atkId || e.noHit) continue;
          for (const b of e.hurtboxes()) {
            if (!G.overlap(box, b)) continue;
            e[p.hitKey] = p.atkId;
            const res = e.hit(p.atkDmg, p.atkDir === 'f' ? p.atkFace : 0, p.atkDir === 'u' ? -1 : p.atkDir === 'd' ? 1 : 0, 'swipe', b);

        }

        }

        const x0 = Math.floor((p.x + 1) / T), x1 = Math.floor((p.x + p.w - 1) / T), y0 = Math.floor((p.y + 1) / T), y1 = Math.floor((p.y + p.h - 1) / T);
        let hz = false;

          const t = this.tile(tx, ty);
          if (t === SPIKE_U) { if (p.y + p.h > ty * T + 9 && p.x + p.w > tx * T + 2 && p.x < tx * T + 14) hz = true; }
          else if (t === SPIKE_D) { if (p.y < ty * T + 7 && p.x + p.w > tx * T + 2 && p.x < tx * T + 14) hz = true; }

      }

          c.healed2 = true; p.hp = Math.max(p.hp, p.maxHp); p.setSafe(c.x - 5, c.y - p.h); this.pop(p.x + 5, p.y - 12, 'committed ✓', C.okHi, true);
        }

      }
      this.sign = null;
      for (const s of this.signs) if (Math.abs(p.x + p.w / 2 - s.x) < 26 && Math.abs(p.y + p.h - s.y) < 30) this.sign = s;
    }

    updateItems(dt) {
      const p = this.player, pcx = p.x + p.w / 2, pcy = p.y + p.h / 2, ps = this.players();
      for (const it of this.items) {
        if (it.dead) continue;

            let tg = ps[0];
            if (ps.length > 1 && Math.hypot(ps[1].x - it.x, ps[1].y - it.y) < Math.hypot(tg.x - it.x, tg.y - it.y)) tg = ps[1];

        const r = it.kind === 'spark' ? 11 : 9;

    }
    collect(it) {
      const p = this.player;
      it.dead = true;
      if (it.id !== undefined) this.got.add(it.id);
      if (it.kind === 'token') {

      if (this.physics(dt)) this.L.dust(this.cx, this.y + this.h, 2);
      if (this.hitWall) this.vx = -this.vx * 0.5;
    }
    draw(g, cx, cy) {
      const air = !this.onGround, squat = this.onGround && this.wait < 0.18;
      this.spr(g, S.typo[air ? 1 : 0], cx, cy, this.face < 0, squat ? 1.15 : 1, squat ? 0.8 : 1);
    }
  }

  // --- flaky test: passes, passes, passes... then doesn't ---
  class Flaky extends Enemy {
    constructor(L, x, y) { super(L, x, y - 4, 10, 9); this.hx = this.x; this.hy = this.y; this.st = 'idle'; this.cd = 1; this.col = '#8fe3a0'; }
    update(dt) {
      this.tick(dt); this.cd -= dt;
      const tp = this.toPlayer();
      if (this.st === 'idle') {
        const tx = this.hx + Math.sin(this.t * 1.3) * 18, ty = this.hy + Math.sin(this.t * 2.6) * 7;
        this.x = G.damp(this.x, tx, 3, dt); this.y = G.damp(this.y, ty, 3, dt);
        this.face = Math.sign(tp.dx) || 1;
        if (tp.d < 118 && this.cd <= 0 && this.stun <= 0) { this.st = 'mad'; this.st_t = 0.5; G.audio.sfx('warn', { vol: 0.5 }); }
      } else if (this.st === 'mad') {
        this.st_t -= dt; this.x += Math.sin(this.t * 60) * 0.5;
        if (this.st_t <= 0) { const n = tp.d || 1; this.vx = (tp.dx / n) * 185; this.vy = (tp.dy / n) * 185; this.st = 'swoop'; this.st_t = 0.62; }
      } else if (this.st === 'swoop') {
        this.st_t -= dt; this.x += this.vx * dt; this.y += this.vy * dt;
        if (this.st_t <= 0 || this.L.solidAt(this.cx, this.cy)) { this.st = 'back'; }
      } else {
        const dx = this.hx - this.x, dy = this.hy - this.y, d = Math.hypot(dx, dy);
        if (d < 4) { this.st = 'idle'; this.cd = 1.4; } else { this.x += (dx / d) * 70 * dt; this.y += (dy / d) * 70 * dt; }
      }
    }
    hit(d, dx, dy, how) { const r = super.hit(d, dx, dy, how); if (r === 'hit') { this.st = 'back'; this.cd = 1; } return r; }
    draw(g, cx, cy) { this.spr(g, (this.st === 'mad' || this.st === 'swoop' ? S.flakyMad : S.flaky)[((this.t * 14) | 0) % 2], cx, cy, false, 1, 1, 2); }
  }

  // --- lint: drifting, prickly, not worth touching ---
  class Lint extends Enemy {
    constructor(L, x, y, vertical) { super(L, x, y - 2, 11, 11); this.hx = this.x; this.hy = this.y; this.v = vertical; this.hp = 2; this.stompable = false; this.col = '#b9b0d0'; this.range = 30; }
    update(dt) {
      this.tick(dt);
      const o = Math.sin(this.t * 1.6) * this.range;
      if (this.v) { this.y = this.hy + o; this.x = this.hx; } else { this.x = this.hx + o; this.y = this.hy + Math.sin(this.t * 3.1) * 3; }
    }
    draw(g, cx, cy) { this.spr(g, S.lint[((this.t * 5) | 0) % 2], cx, cy, false, 1, 1, 2); }
  }

  // --- logger: spams the room with output ---
  class Logger extends Enemy {
    constructor(L, x, y) { super(L, x, y, 14, 15); this.hp = 2; this.cd = 1 + G.hash(x, y, 4); this.open = 0; this.col = '#cfc6b4'; this.loot = 2; }
    update(dt) {
      this.tick(dt); this.cd -= dt;
      const tp = this.toPlayer();
      this.face = Math.sign(tp.dx) || 1;
      if (this.open > 0) {
        this.open -= dt;
        if (this.open <= 0.18 && !this.shot) { this.shot = true; this.L.shoot(this.cx + this.face * 8, this.y + 6, this.face * 135, 0, { kind: 'log', col: '#7dff9a', r: 3 }); G.audio.sfx('shoot'); }
      } else if (this.cd <= 0 && Math.abs(tp.dx) < 200 && Math.abs(tp.dy) < 56 && this.stun <= 0) { this.open = 0.5; this.shot = false; this.cd = 2.1; }

      this.physics(dt);
    }
    draw(g, cx, cy) { this.spr(g, S.logger[this.open > 0 ? 1 : 0], cx, cy, false, 1, this.open > 0.3 ? 0.92 : 1); if (this.open > 0) G.light(this.cx - cx, this.y + 5 - cy, 24, '#7dff9a', 0.6, 0.25); }
  }

  // --- mimic: a deprecated package that was never really removed ---
  class Mimic extends Enemy {
    constructor(L, x, y) { super(L, x, y, 16, 14); this.hp = 3; this.awake = false; this.passive = true; this.wait = 0.5; this.col = '#c08a4e'; this.loot = 4; this.kb = 0.4; }
    wake() { if (this.awake) return; this.awake = true; this.passive = false; this.vy = -150; this.onGround = false; this.L.pop(this.cx, this.y - 8, 'DEPRECATED!', '#ffb3b3'); G.audio.sfx('warn'); }
    update(dt) {
      this.tick(dt);

      if (!this.awake) { if (tp.d < 46 && Math.abs(tp.dy) < 26) this.wake(); this.physics(dt); return; }

        this.vx *= 0.6; this.wait -= dt;
        if (this.wait <= 0 && this.stun <= 0) { this.face = Math.sign(tp.dx) || 1; this.vx = this.face * 74; this.vy = -255; this.onGround = false; this.wait = 0.7; }
      }
      if (this.physics(dt)) { this.L.dust(this.cx, this.y + this.h, 5); this.L.shake(0.14); G.audio.sfx('thud', { vol: 0.5 }); }
    }
    onHurt() { this.wake(); }
    draw(g, cx, cy) { this.spr(g, S.mimic[!this.awake ? 0 : this.onGround ? 1 : 2], cx, cy, this.face > 0 && this.awake, 1, 1, this.awake ? 0 : 3); }
  }

  // --- noodle: spaghetti code. winds up, then goes everywhere at once ---
  class Noodle extends Enemy {
    constructor(L, x, y) { super(L, x, y, 16, 9); this.hp = 2; this.st = 'walk'; this.st_t = 0; this.col = '#f6d76b'; this.face = G.hash(x, y, 1) < 0.5 ? -1 : 1; this.loot = 2; }
    update(dt) {
      this.tick(dt); this.st_t -= dt;
      const tp = this.toPlayer();
      if (this.st === 'walk') {
        if (this.onGround) { if (this.hitWall || this.edgeAhead(this.face)) this.face = -this.face; if (this.stun <= 0) this.vx = this.face * 17; }
        if (Math.abs(tp.dy) < 22 && Math.abs(tp.dx) < 115 && this.stun <= 0 && this.onGround) { this.face = Math.sign(tp.dx) || 1; this.st = 'rev'; this.st_t = 0.5; this.vx = 0; G.audio.sfx('charge', { vol: 0.6 }); }
      } else if (this.st === 'rev') {
        this.vx = 0;
        if (this.st_t <= 0) { this.st = 'charge'; this.st_t = 0.95; }
      } else if (this.st === 'charge') {
        this.vx = this.face * 195;

      } else { this.vx *= 0.8; if (this.st_t <= 0) this.st = 'walk'; }
      this.physics(dt);
    }
    draw(g, cx, cy) {
      const mad = this.st === 'rev' || this.st === 'charge';
      const img = S.noodle[(mad ? 2 : 0) + (((this.t * (mad ? 16 : 5)) | 0) % 2)];
      const jit = this.st === 'rev' ? ((this.t * 40) | 0) % 2 : 0;
      this.spr(g, img, cx + jit, cy, this.face < 0, this.st === 'tired' ? 1.1 : 1, this.st === 'tired' ? 0.85 : 1);
      if (this.st === 'tired' && ((this.t * 4) | 0) % 2) G.text(g, 'z', this.cx - cx + 6, this.y - cy - 8, '#f4ede0', { tiny: true });
    }
  }

  // --- leak: a blob of memory nobody freed. splits when popped ---
  class Slime extends Enemy {
    constructor(L, x, y, small) { super(L, x, y, small ? 8 : 14, small ? 6 : 10); this.small = small; this.hp = small ? 1 : 2; this.wait = 0.5 + G.hash(x, y, 2) * 0.6; this.col = '#58f0c8'; this.loot = small ? 1 : 0; }
    update(dt) {
      this.tick(dt);

        this.vx *= 0.6; this.wait -= dt;
        if (this.wait <= 0 && this.stun <= 0) {
          const tp = this.toPlayer();
          this.face = tp.d < 130 ? Math.sign(tp.dx) || 1 : (Math.random() < 0.5 ? -1 : 1);
          if (this.edgeAhead(this.face) && tp.d > 50) this.face = -this.face;
          this.vx = this.face * (this.small ? 62 : 44); this.vy = this.small ? -175 : -150; this.onGround = false; this.wait = this.small ? 0.5 : 0.9;
        }
      }
      if (this.physics(dt)) this.land = 0.14;
      if (this.land > 0) this.land -= dt;
      if (this.hitWall) this.vx = -this.vx * 0.5;
    }
    die(how) {
      super.die(how);
      if (!this.small) for (const d of [-1, 1]) { const s = new Slime(this.L, this.x, this.y, true); s.x = this.cx - 4 + d * 4; s.y = this.y; s.vx = d * 80; s.vy = -170; s.wait = 0.5; this.L.ents.push(s); }
    }
    draw(g, cx, cy) {
      const sq = this.land > 0 ? 1.2 : this.onGround && this.wait < 0.15 ? 1.12 : !this.onGround ? 0.88 : 1;
      this.spr(g, (this.small ? S.slimeS : S.slime)[((this.t * 3) | 0) % 2], cx, cy, false, sq, 2 - sq);
      G.light(this.cx - cx, this.cy - cy, 22, '#58f0c8', 0.5, 0.16);
    }
  }

  // --- heisenbug: only moves when you are not looking ---
  class Ghost extends Enemy {
    constructor(L, x, y) { super(L, x, y - 3, 12, 13); this.hp = 2; this.shy = false; this.col = '#cfe6ff'; this.front = true; this.loot = 3; this.a = 0.9; }
    update(dt) {
      this.tick(dt);
      const p = this.L.player, tp = this.toPlayer();
      this.shy = Math.sign(tp.dx) === -p.face && tp.d < 190;
      this.face = Math.sign(tp.dx) || 1;
      if (!this.shy && tp.d < 190 && tp.d > 2 && this.stun <= 0 && !p.dead) { this.x += (tp.dx / tp.d) * 44 * dt; this.y += (tp.dy / tp.d) * 44 * dt; }
      this.vx *= 0.9; this.x += this.vx * dt;
      this.a = G.damp(this.a, this.shy ? 0.55 : 0.95, 8, dt);
    }
    draw(g, cx, cy) {
      g.globalAlpha = this.a;
      this.spr(g, S.ghost[this.shy ? 2 : ((this.t * 4) | 0) % 2], cx, cy, this.face < 0, 1, 1, Math.round(Math.sin(this.t * 3) * 2));
      g.globalAlpha = 1;
      G.light(this.cx - cx, this.cy - cy, 30, '#cfe6ff', 0.6, 0.2);
    }
  }

  // --- racer: a thread that got there first ---
  class Racer extends Enemy {
    constructor(L, x, y) { super(L, x, y, 14, 8); this.pause = 0; this.col = '#ffb347'; this.face = G.hash(x, y, 1) < 0.5 ? -1 : 1; }
    update(dt) {
      this.tick(dt);
      if (this.pause > 0) { this.pause -= dt; this.vx = 0; }
      else if (this.onGround && this.stun <= 0) {
        if (this.hitWall || this.edgeAhead(this.face)) { this.face = -this.face; this.pause = 0.4; this.vx = 0; }
        else { this.vx = this.face * 132; if (Math.random() < 0.3) this.L.dust(this.cx - this.face * 7, this.y + this.h, 1, -this.face); }
      }
      this.physics(dt);
    }
    draw(g, cx, cy) { this.spr(g, S.racer[((this.t * 14) | 0) % 2], cx, cy, this.face < 0, this.pause > 0 ? 0.9 : 1.05, this.pause > 0 ? 1.1 : 1); }
  }

  // --- hotfix drone: shoots first, opens a ticket later ---
  class Drone extends Enemy {
    constructor(L, x, y) { super(L, x, y - 6, 14, 10); this.hp = 2; this.cd = 1.5; this.aim = 0; this.col = '#8a92a8'; this.loot = 3; }
    update(dt) {
      this.tick(dt);
      const p = this.L.player, tp = this.toPlayer();
      if (tp.d < 210) {
        this.cd -= dt;
        const side = this.cx < p.x ? -1 : 1, tx = p.x + 5 + side * 66 - this.w / 2, ty = p.y - 46;
        if (this.aim <= 0 && this.stun <= 0) {
          const nx = G.damp(this.x, tx, 1.3, dt), ny = G.damp(this.y, ty, 1.3, dt);
          if (!this.L.boxHitsSolid(nx, this.y, this.w, this.h)) this.x = nx;
          if (!this.L.boxHitsSolid(this.x, ny, this.w, this.h)) this.y = ny;
        }
        if (this.aim > 0) {
          this.aim -= dt;
          if (this.aim <= 0) { const n = tp.d || 1; this.L.shoot(this.cx, this.cy + 4, (tp.dx / n) * 125, (tp.dy / n) * 125, { kind: 'orb', col: '#ff5d5d', r: 3 }); G.audio.sfx('shoot'); this.cd = 2.5; }
        } else if (this.cd <= 0) { this.aim = 0.5; G.audio.sfx('warn', { vol: 0.5 }); }
      }
      this.y += Math.sin(this.t * 4) * 0.15;
      this.x += this.vx * dt; this.vx *= 0.88;
    }
    draw(g, cx, cy) {
      this.spr(g, S.drone[(this.aim > 0 ? 2 : 0) + (((this.t * 20) | 0) % 2)], cx, cy, false, 1, 1, 3);
      G.light(this.cx - cx, this.cy + 4 - cy, this.aim > 0 ? 30 : 16, '#ff5d5d', 0.7, this.aim > 0 ? 0.4 : 0.15);
    }
  }

  // --- hazards: not alive, cannot be hurt ---
  class Pendulum extends Enemy {
    constructor(L, x, y) { super(L, x, y, 12, 12); this.ax = x + 8; this.ay = y; this.len = 54; this.noHit = true; this.stompable = false; this.dashable = false; this.ph = G.hash(x, y, 6) * 6; this.always = false; this.place(); }
    place() { const a = Math.sin(this.L.time * 1.8 + this.ph) * 1.15; this.bx = this.ax + Math.sin(a) * this.len; this.by = this.ay + Math.cos(a) * this.len; this.x = this.bx - 6; this.y = this.by - 6; }
    update() { this.place(); }
    draw(g, cx, cy) {
      const n = 9;
      for (let i = 0; i <= n; i++) { const u = i / n; g.fillStyle = i % 2 ? '#8b91a3' : '#5c6378'; g.fillRect(Math.round(G.lerp(this.ax, this.bx, u)) - cx - 1, Math.round(G.lerp(this.ay, this.by, u)) - cy - 1, 2, 2); }
      g.fillStyle = C.ink; g.fillRect(this.ax - cx - 3, this.ay - cy, 6, 3);
      g.drawImage(S.pendulum, Math.round(this.bx) - cx - 9, Math.round(this.by) - cy - 9);
      G.light(this.bx - cx, this.by - cy, 20, C.hazard, 0.4, 0.14);
    }
  }
  class Gear extends Enemy {
    constructor(L, x, y, moving) {
      super(L, x, y, 18, 18); this.x = x - 1; this.y = y - 1; this.noHit = true; this.stompable = false; this.dashable = false;
      this.a = this.x; this.b = this.x; this.ph = G.hash(x, y, 2);
      if (moving) {
        const row = L.def.map[y / T], tx = x / T;
        for (let i = tx + 1; i < row.length; i++) if (row[i] === '|') { this.b = i * T - 1; break; }
        if (this.b === this.a) for (let i = tx - 1; i >= 0; i--) if (row[i] === '|') { this.b = i * T - 1; break; }
        this.always = true;
      }
    }
    update(dt) {
      this.t += dt;
      const span = Math.abs(this.b - this.a);
      if (span > 1) { const period = (span / 58) * 2, u = 0.5 - 0.5 * Math.cos(((this.L.time / period + this.ph) % 1) * Math.PI * 2); this.x = G.lerp(this.a, this.b, u); }
      if (Math.random() < 0.06) this.L.spark(this.cx + G.rand(-8, 8), this.cy + 9, '#ffe27a', 1);
    }
    harmboxes() { return [{ x: this.x + 2, y: this.y + 2, w: 14, h: 14 }]; }
    draw(g, cx, cy) { g.drawImage(S.gear[((this.t * 16) | 0) % 6], Math.round(this.cx) - cx - 13, Math.round(this.cy) - cy - 13); }
  }
  class Dripper extends Enemy {
    constructor(L, x, y) { super(L, x, y, 4, 4); this.x = x + 6; this.y = y; this.noHit = true; this.passive = true; this.cd = G.hash(x, y, 8) * 2; this.grow = 0; }
    update(dt) {
      this.cd -= dt;
      if (this.grow > 0) {
        this.grow -= dt;
        if (this.grow <= 0) { this.L.shoot(this.x + 2, this.y + 5, 0, 20, { kind: 'drip', col: this.L.th.liq, g: 520, r: 2, cut: false, onLand: (q, L) => { L.burst(q.x, q.y - 2, 4, [L.th.liq, L.th.liqHi], 50, 300); if (Math.abs(q.x - L.player.x) < 200) G.audio.sfx('drip', { vol: 0.6 }); } }); this.cd = 1.7; }
      } else if (this.cd <= 0) this.grow = 0.55;
    }
    draw(g, cx, cy) {
      const th = this.L.th;
      g.fillStyle = th.liqLo; g.fillRect(this.x - cx - 1, this.y - cy, 6, 2);
      if (this.grow > 0) { const s = Math.ceil((1 - this.grow / 0.55) * 4); g.fillStyle = th.liq; g.fillRect(this.x - cx + 1, this.y - cy + 2, 2, s); g.fillRect(this.x - cx, this.y - cy + 1 + s, 4, 2); }
    }
  }
  class FireJet extends Enemy {
    constructor(L, x, y) { super(L, x, y, 10, 44); this.x = x + 3; this.y = y + T - 44; this.noHit = true; this.stompable = false; this.dashable = false; this.ph = G.hash(x, y, 9) * 3.2; this.on = false; this.bx = x; this.by = y; }
    update(dt) {
      this.t += dt;
      const c = (this.L.time + this.ph) % 3.2;
      const was = this.on;
      this.warn = c > 1.5 && c < 2.1; this.on = c >= 2.1;
      this.passive = !this.on;
      if (this.on && !was && Math.abs(this.cx - this.L.player.x) < 220) G.audio.sfx('dash', { vol: 0.5 });
      if (this.warn && Math.random() < 0.4) this.L.part(this.cx + G.rand(-3, 3), this.by + 12, G.rand(-10, 10), G.rand(-60, -20), 0.3, 1, '#ffd23f', 0, { glow: 1 });
      if (this.on) for (let i = 0; i < 3; i++) this.L.part(this.cx + G.rand(-4, 4), this.by + 12, G.rand(-14, 14), G.rand(-230, -150), G.rand(0.14, 0.24), 2 + (Math.random() * 3 | 0), G.pick(['#fff', '#ffd23f', '#ff7a2f', '#ff4b3e']), 0, { glow: 1 });
    }
    draw(g, cx, cy) {
      const x = this.bx - cx, y = this.by - cy;
      g.fillStyle = C.ink; g.fillRect(x + 2, y + 11, 12, 5);
      g.fillStyle = this.warn && ((this.t * 12) | 0) % 2 ? '#ffd23f' : '#5c6378'; g.fillRect(x + 3, y + 12, 10, 3);
      g.fillStyle = '#1b1226'; g.fillRect(x + 5, y + 12, 6, 1);
      if (this.on) G.light(x + 8, y - 10, 60, '#ff7a2f', 1, 0.4);
    }
  }

  const MAKE = {
    b: (L, x, y) => new Bug(L, x, y, false), a: (L, x, y) => new Bug(L, x, y, true), t: (L, x, y) => new Typo(L, x, y),
    f: (L, x, y) => new Flaky(L, x, y), l: (L, x, y) => new Lint(L, x, y, false), L: (L, x, y) => new Lint(L, x, y, true),
    g: (L, x, y) => new Logger(L, x, y), m: (L, x, y) => new Mimic(L, x, y), n: (L, x, y) => new Noodle(L, x, y),
    s: (L, x, y) => new Slime(L, x, y, false), h: (L, x, y) => new Ghost(L, x, y), r: (L, x, y) => new Racer(L, x, y),
    d: (L, x, y) => new Drone(L, x, y), p: (L, x, y) => new Pendulum(L, x, y), O: (L, x, y) => new Gear(L, x, y, false),
    Q: (L, x, y) => new Gear(L, x, y, true), i: (L, x, y) => new Dripper(L, x, y), F: (L, x, y) => new FireJet(L, x, y),
  };
  G.spawnEnemy = (ch, x, y, L) => (MAKE[ch] ? MAKE[ch](L, x, y) : null);
  G.Enemies = { Bug, Typo, Flaky, Lint, Logger, Mimic, Noodle, Slime, Ghost, Racer, Drone };
})();

      if (this.boltN > 0 || (this.beam && !this.beam.on)) G.ring(g, ex, ey, 18 + Math.sin(this.t * 30) * 2, C.hazardHi);

    const L = { C: ['####', '#...', '#...', '#...', '####'], L: ['#...', '#...', '#...', '#...', '####'], A: ['.##.', '#..#', '####', '#..#', '#..#'], W: ['#...#', '#...#', '#.#.#', '##.##', '#...#'], D: ['###.', '#..#', '#..#', '#..#', '###.'] };

        if (rows[j][i] !== '#') continue;
        const px = 2 + i * U, py = 2 + j * U, up = j > 0 && rows[j - 1][i] === '#', dn = j < 4 && rows[j + 1][i] === '#';
        p.rect(px, py, U, U, C.clawd);

  const groundStrip = (() => { let c = null; return () => { if (!c) { c = G.makeCanvas(W + 32, 32); for (let i = 0; i < 26; i++) for (let j = 0; j < 2; j++) G.drawSolid(c.g, 1, i * 16, j * 16, i + 40, j + 3, { u: j > 0, d: true, l: true, r: true }); } return c; }; })();

  // =====================================================================
  // title

  function Title(skipPress) {
    let t = 0, state = skipPress && A.ctx ? 'drop' : 'press', sel = 0, opts = null, confirm = false, dropT = 0, spoke = false, landed = 0;
    const items = () => (SV().started ? ['continue', 'new game', 'options'] : ['new game', 'options']);
    const begin = () => { state = 'drop'; dropT = 0; landed = 0; A.music('title'); };

    return {
      enter() { A.intensity = 0; if (state === 'drop') begin(); G.voice.warm(['nar_title']); },
      update(dt) {

        if (opts) { opts.update(dt); return; }

        dropT += dt;
        const n = Math.min(5, Math.floor((dropT - 0.25) / 0.16 + 0.55));
        if (n > landed) { landed = n; A.sfx('stamp'); }
        if (state === 'drop' && dropT > 1.5) { state = 'menu'; if (!spoke) { spoke = true; G.speak(cap, 'nar_title'); cap.text = ''; } }

        if (I.pressed.up) { sel = (sel + it.length - 1) % it.length; A.sfx('uiMove'); }

      draw(g, ug) {

        G.drawClawd(g, 84, 184 + hop, { u: 2, face: look, blink: (t % 3.3) < 0.13, legs: Math.sin(t * 2.6) > 0.55 && !hop ? [1, 1, 1, 1] : [2, 2, 2, 2], lift: Math.sin(t * 2.6) > 0.55 && !hop ? 1 : 0, armL: hop ? -2 : 0, armR: hop ? -2 : 0 });

  }

  // =====================================================================
  // world map: git log --graph

  let previewC = null;
  function MapScene() {
    const N = G.NODES.length;
    let sel = G.clamp(SV().node || 0, 0, N - 1), t = 0, scroll = sel, clawdY = sel, moved = 0;
    while (sel > 0 && !isUnlocked(sel)) sel--;
    const ROW = 18, TX = 24, BX = 42, baseY = 124;

    return {
      enter() { A.music('map'); A.intensity = 0; scroll = clawdY = sel; },
      update(dt) {
        t += dt; moved -= dt;
        scroll = G.damp(scroll, sel, 10, dt); clawdY = G.damp(clawdY, sel, 14, dt);
        if (G.transitioning()) return;
        const I = G.input;
        const dir = (I.pressed.up ? 1 : 0) - (I.pressed.down ? 1 : 0);
        if (dir) {
          const n = sel + dir;
          if (n >= 0 && n < N && isUnlocked(n)) { sel = n; moved = 0.2; A.sfx('uiMove'); } else A.sfx('uiBack');
        }
        if (I.ok) { SV().node = sel; G.save.write(); A.sfx('uiOk'); G.startLevel(G.NODES[sel]); }
        else if (I.pressed.pause) { A.sfx('uiBack'); G.go(() => Title(true)); }
      },
      draw(g, ug) {
        const id = G.NODES[sel], def = G.LEVELS[id], th = G.THEME[def.world];
        g.fillStyle = '#131019'; g.fillRect(0, 0, W, H);
        g.fillStyle = '#17131f'; g.fillRect(0, 0, 196, H);
        for (let y = ((-scroll * ROW) % 36 + 36) % 36; y < H; y += 36) { g.fillStyle = '#1b1724'; g.fillRect(0, Math.round(y), 196, 18); }
        // graph lines
        const trunkCol = '#5a5568';
        g.fillStyle = trunkCol; g.fillRect(TX, Math.max(0, Math.round(yOf(N) - 6)), 1, Math.round(yOf(-1)) - Math.max(0, Math.round(yOf(N) - 6)));
        let prevTrunk = -1;
        for (let i = 0; i < N; i++) {
          const d = G.LEVELS[G.NODES[i]], col = G.THEME[d.world].accent, y = Math.round(yOf(i));
          if (d.boss) { prevTrunk = i; continue; }
          const first = i === 0 || G.LEVELS[G.NODES[i - 1]].boss, nextBoss = i + 1 < N && G.LEVELS[G.NODES[i + 1]].boss;
          const lit = isUnlocked(i) ? col : '#3a3346';

          else { g.fillStyle = lit; g.fillRect(BX, y, 1, ROW); }

        for (let i = 0; i < N; i++) {

          const col = G.THEME[d.world].accent, x = d.boss ? TX : BX, open = isUnlocked(i), done = !!SV().cleared[nid];
          if (done) { G.disc(g, x, y, d.boss ? 4 : 3, col); G.disc(g, x, y, 1, '#17131f'); }
          else if (open) { G.disc(g, x, y, d.boss ? 4 : 3, '#17131f'); G.ring(g, x, y, d.boss ? 4 : 3, col); if (((t * 3) | 0) % 2) G.ring(g, x, y, d.boss ? 6 : 5, G.rgba(col, 0.5)); }
          else G.disc(g, x, y, 2, '#3a3346');
          const on = i === sel;

          const label = open ? d.name : 'locked';

        G.drawClawd(g, cxp, Math.round(yOf(clawdY)) - 5 - (moved > 0 ? Math.sin((moved / 0.2) * Math.PI) * 5 : Math.abs(Math.sin(t * 3)) * 1.5), { u: 1, face: 1, blink: (t % 3) < 0.12 });

        G.text(g, '$ git log --graph', 8, 5, '#7dff9a', { tiny: true });
        G.text(g, '✳ ' + G.save.sparkCount(), 188, 5, C.clawdHi, { tiny: true, align: 'r' });
        g.fillStyle = '#2a2338'; g.fillRect(196, 0, 1, H);

        G.lights.length = keep;

        const done = SV().cleared[id], yb = H - 34;
        G.text(g, done ? '✓ passing' : '✗ failing', px, yb, done ? C.ok : C.bad);
        if (SV().best[id]) G.text(g, 'best ' + G.fmtTime(SV().best[id]), px + pw, yb, C.dim, { align: 'r' });

        G.text(g, th.time + ' AM', px + pw, 4, '#6b6578', { tiny: true, align: 'r' });
        G.keycap(g, px, H - 17, 'Z'); G.text(g, 'checkout', px + 15, H - 14, C.dim); G.keycap(g, px + 78, H - 17, 'ESC'); G.text(g, 'title', px + 101, H - 14, C.dim);
        G.ambient = null;
      },
    };
  }

  G.startLevel = (id, snap) => {
    const def = G.LEVELS[id], key = 'w' + def.world;
    if (/-1$/.test(id) && !SV().seen[key] && !snap) G.go(() => G.CUT.world(def.world, () => { SV().seen[key] = true; G.save.write(); G.go(() => Play(id)); }));
    else G.go(() => Play(id, snap));
  };

  // =====================================================================
  // play
  // =====================================================================
  const BOSS_LINES = { null: ['null_intro'], merge: ['head_intro', 'theirs_intro'], leak: ['leak_intro'], loop: ['loop_intro'], mono: ['mono_intro'] };
  const FAILS = ['Segmentation fault (core dumped)', 'Process exited with code 1', 'Uncaught exception: Clawd is undefined', 'panic: runtime error', 'Killed: 9'];
  function Play(id, snap) {
    const def = G.LEVELS[id], L = new G.Level(def, snap), th = L.th, p = L.player;
    const cap = new G.Caption();
    let state = 'play', pausedBy = '', gpause = false, fz = false, frozenBefore = false, t = 0, wait = 0, sel = 0, opts = null, intro = null, res = null, failMsg = '', bars = 0, hpShake = 0, lastHp = p.hp, tokPop = 0, lastTok = L.tokens;
    const say = (vid) => G.speak(cap, vid);
    const startFight = () => { state = 'play'; p.frozen = false; L.boss.start(); SV().seen['b' + id] = true; G.save.write(); A.music(def.boss === 'mono' ? 'final' : 'boss', { fade: 0.3 }); cap.text = ''; };
    const finish = () => {
      const d = SV(), sp = d.sparks[id] || [false, false, false];
      d.cleared[id] = true;
      L.sparks.forEach((s, i) => { if (s) sp[i] = true; });
      d.sparks[id] = sp;
      const best = !d.best[id] || L.clock < d.best[id];
      if (best) d.best[id] = L.clock;
      d.tokens += L.tokens; d.node = Math.min(G.NODES.length - 1, nodeIndex(id) + 1);
      G.save.write();
      const rows = [];
      rows.push([def.boss ? 'conflict resolved' : 'reached the exit', G.fmtTime(L.clock), 1]);
      rows.push(['tokens', def.boss ? String(L.tokens) : L.tokens + (L.tokTotal ? ' / ' + L.tokTotal : ''), 1]);
      if (!def.boss) rows.push(['sparks', L.sparks, L.sparks.every(Boolean) ? 1 : 0]);
      rows.push([L.hits ? 'hits taken: ' + L.hits : 'no hits taken', '', L.hits ? 0 : 1]);
      res = { rows, best, shown: 0, t: 0 };
      state = 'clear'; p.frozen = true; p.celebrate = true; p.vx = 0;
      A.music('clear'); G.voice.warm(['sys_pass']); setTimeout(() => G.voice.play('sys_pass'), 900);
    };
    const leave = () => {
      const d = SV();
      if (def.boss && def.reward && !d.tools[def.reward]) { d.tools[def.reward] = true; G.save.write(); G.go(() => G.CUT.tool(def.reward, () => G.go(() => MapScene()))); }
      else if (id === G.NODES[G.NODES.length - 1]) { d.finished = true; G.save.write(); G.go(() => G.CUT.ending(() => G.go(() => Title(true))), { speed: 1.2, col: '#ffffff' }); }
      else G.go(() => MapScene());
    };
    return {
      L,
      getState: () => state,
      // used by the co-op layer: the partner pauses or resumes the game for both of us
      pauseFor(on, by) {
        if (on && state === 'play' && !p.dead && !G.transitioning()) { state = 'paused'; sel = 0; pausedBy = by || ''; A.sfx('pause'); A.duck(0.35); if (L.net === 'host') G.coop.setState(state, failMsg, res); }
        else if (!on && state === 'paused') { state = 'play'; pausedBy = ''; opts = null; A.sfx('pause'); A.duck(1); }
      },
      enter() {
        A.intensity = 0;
        if (G.coop) G.coop.playEnter(L, cap);
        if (L.net === 'guest') { A.music(L.boss ? 'tension' : (def.music || th.music)); return; }
        if (L.boss) {
          p.frozen = true; state = 'bossIntro';
          const seen = SV().seen['b' + id];
          intro = { lines: seen ? [] : BOSS_LINES[def.boss].slice(), t: 0, lineT: seen ? 1.5 : 1.3, quick: seen };
          G.voice.warm(BOSS_LINES[def.boss].concat([def.boss + '_p2', def.boss + '_die', 'head_alone', 'theirs_alone', 'head_die', 'theirs_die', 'mono_p3'].filter((v) => G.voice.has(v))));
          A.music('tension');
        } else A.music(def.music || th.music);
      },
      update(dt) {
        const I = G.input;
        if (L.net === 'guest') {
          const hs = G.coop.hostState;
          if (hs.st !== state) {
            state = hs.st;
            if (state !== 'paused' && !opts) gpause = false;
            if (state === 'dead') { wait = 0.5; failMsg = hs.fm; }
            if (state === 'clear' && hs.rs) { res = { rows: hs.rs.rows, best: hs.rs.best, shown: 0, t: 0 }; A.music('clear'); }
            if (state === 'bossIntro') intro = { t: 0 };
          }
          // either player can pause for both; either can resume. The guest's menu is local, the pause itself lives on the host.
          if (opts) opts.update(dt);
          else if (gpause) {
            if (I.pressed.down) { sel = (sel + 1) % 3; A.sfx('uiMove'); }
            if (I.pressed.up) { sel = (sel + 2) % 3; A.sfx('uiMove'); }
            if (I.pressed.pause || ((I.pressed.jump || I.pressed.attack || I.pressed.start) && sel === 0)) { gpause = false; G.coop.send({ t: 'pz', on: false, e: L._ep }); A.sfx('pause'); }
            else if (I.pressed.jump || I.pressed.attack || I.pressed.start) {
              A.sfx('uiOk');
              if (sel === 1) opts = Options(() => { opts = null; });
              else { gpause = false; G.coop.disconnect(); }
            }
          } else if ((state === 'play' || state === 'paused') && (I.pressed.pause || I.pressed.start) && !p.dead && !G.transitioning()) {
            gpause = true; sel = 0; G.coop.send({ t: 'pz', on: true, e: L._ep }); A.sfx('pause');
          }
          const wantFz = state === 'paused' || gpause;
          if (wantFz && !fz) { fz = true; frozenBefore = p.frozen; p.frozen = true; } else if (!wantFz && fz) { fz = false; p.frozen = frozenBefore; }
          t += dt; cap.update(dt);
          bars = G.damp(bars, state === 'bossIntro' || (L.boss && L.boss.dying) ? 1 : 0, 6, dt);
          if (hpShake > 0) hpShake -= dt;
          if (p.hp < lastHp) hpShake = 0.4;
          lastHp = p.hp;
          if (L.tokens !== lastTok) { tokPop = 0.15; lastTok = L.tokens; }
          if (tokPop > 0) tokPop -= dt;
          if (state === 'bossIntro' && intro) intro.t += dt;
          if (state === 'clear' && res) { res.t += dt; const n = Math.min(res.rows.length + 1, Math.floor((res.t - 0.7) / 0.38)); if (n > res.shown) { res.shown = n; A.sfx(n <= res.rows.length ? 'tick' : 'uiOk'); } }
          L.update(dt);
          return;
        }
        if (opts) { if (state === 'paused' && L.net === 'host') { G.coop.setState(state, failMsg, res); G.coop.pauseTick(L, dt); } opts.update(dt); return; }
        if (state === 'paused') {
          if (L.net === 'host') { G.coop.setState(state, failMsg, res); G.coop.pauseTick(L, dt); }
          const items = 4;
          if (I.pressed.pause || I.pressed.start && sel === 0) { state = 'play'; pausedBy = ''; A.sfx('pause'); A.duck(1); return; }
          if (I.pressed.down) { sel = (sel + 1) % items; A.sfx('uiMove'); }
          if (I.pressed.up) { sel = (sel + items - 1) % items; A.sfx('uiMove'); }
          if (I.pressed.jump || I.pressed.attack || I.pressed.start) {
            A.sfx('uiOk'); A.duck(1);
            if (sel === 0) { state = 'play'; pausedBy = ''; }
            else if (sel === 1) G.go(() => Play(id, def.boss ? null : L.snapshot()));
            else if (sel === 2) opts = Options(() => { opts = null; });
            else G.go(() => MapScene());
          }
          return;
        }
        t += dt; cap.update(dt);

<script>
// js/main.js
// CLAWD: EXIT CODE 0 - boot + main loop
(function () {
  'use strict';
  const G = window.G, STEP = 1 / 60;
  const Q = (G.query = new URLSearchParams(location.search));

  // ---------- scene switching with a diamond wipe ----------
  let trans = null;
  G.scene = { update() {}, draw() {} };
  G.setScene = (s) => { G.scene = s; if (s.enter) s.enter(); };
  // make() builds the next scene while the screen is covered
  G.go = (make, o) => {
    if (trans) return;
    o = o || {};
    trans = { t: 0, phase: 0, make, speed: o.speed || 2.6, col: o.col || '#0d0a12', hold: o.hold || 0.08 };
    G.input.locked = true;
  };
  G.transitioning = () => !!trans;
  function stepTrans(dt) {
    if (!trans) return;
    if (trans.phase === 0) {
      trans.t += dt * trans.speed;
      if (trans.t >= 1) { trans.t = 1; trans.phase = 1; trans.wait = trans.hold; G.setScene(trans.make()); }
    } else if (trans.phase === 1) {
      trans.wait -= dt;
      if (trans.wait <= 0) trans.phase = 2;
    } else {
      trans.t -= dt * trans.speed;
      if (trans.t <= 0) { trans = null; G.input.locked = false; }
    }
  }

  // favicon: Clawd, naturally
  (() => {
    const c = G.makeCanvas(32, 32);
    c.g.fillStyle = '#17131f'; c.g.fillRect(0, 0, 32, 32);
    G.drawClawd(c.g, 16, 26, { u: 2, face: 0, eyeX: 0 });
    const l = document.createElement('link'); l.rel = 'icon'; l.href = c.toDataURL(); document.head.appendChild(l);
  })();

  G.save.load();
  G.applyMin = () => { G.resize(); G.audio.applyFx(); };
  G.applyMin();
  if (Q.has('mute')) G.audio.muted = true;

  // ---------- pick the first scene ----------
  if (Q.has('sheet')) G.setScene({ update() {}, draw(g) { G.debugSheet(g); } });
  else if (G.Scenes) G.setScene(G.Scenes.boot());

  let acc = 0, last = performance.now(), lastDraw = 0;
  const manual = Q.has('manual');             // tests drive the clock themselves
  G.render = () => {
    G.ug.clearRect(0, 0, G.W, G.H);
    G.ambient = null;
    G.scene.draw(G.g, G.ug);
    if (trans) G.wipe(G.ug, G.ease.io(G.clamp(trans.t, 0, 1)), trans.col, trans.phase === 2 ? -1 : 1);
    G.present();
  };
  G.step = (n, quiet) => {
    for (let i = 0; i < n; i++) { G.input.poll(); stepTrans(STEP); G.scene.update(STEP); G.time += STEP; G.frame++; }
    if (manual && !quiet) G.render();
  };
  function frame(now) {
    requestAnimationFrame(frame);
    let dt = (now - last) / 1000;
    last = now;
    if (manual) return;
    if (dt > 0.1) dt = 0.1;
    acc += dt;
    let n = 0;
    while (acc >= STEP && n < 4) { G.step(1); acc -= STEP; n++; }
    if (n === 4) acc = 0;
    if (G.mobile || G.save.data.opt.min) { const e = now - lastDraw; if (e < 30) return; lastDraw = e > 70 ? now : lastDraw + 1000 / 30; }
    G.render();
  }
  requestAnimationFrame(frame);
})();

<script>
// On-screen buttons for phones and tablets. They feed the same input the keyboard does.
(function () {
  'use strict';
  var G = window.G, pad = document.getElementById('touch'), on = false;
  function enable() {
    if (on) return;
    on = true; G.mobile = true; G.input.touch = {}; pad.hidden = false; document.body.classList.add('touch');
    window.dispatchEvent(new Event('resize'));
  }
  if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) enable();
  window.addEventListener('pointerdown', function (e) { if (e.pointerType === 'touch') enable(); window.focus(); }, { passive: true });
  Array.prototype.forEach.call(pad.querySelectorAll('.k'), function (b) {
    var a = b.getAttribute('data-a');
    function set(v) { return function (e) { e.preventDefault(); if (!G.input.touch) return; G.input.touch[a] = v; b.classList.toggle('on', v); if (v && b.setPointerCapture) { try { b.setPointerCapture(e.pointerId); } catch (err) { /* fine */ } } }; }
    b.addEventListener('pointerdown', set(true));
    b.addEventListener('pointerup', set(false));
    b.addEventListener('pointercancel', set(false));
    b.addEventListener('lostpointercapture', set(false));
    b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  });

  // round analog stick -> left/right/up/down, with a dead zone so a resting thumb does nothing
  var stick = document.getElementById('stick'), knob = document.getElementById('knob'), sid = null;
  function dirs(l, r, u, d) { var t = G.input.touch; if (!t) return; t.left = l; t.right = r; t.up = u; t.down = d; }
  function move(e) {
    var b = stick.getBoundingClientRect(), R = b.width / 2;
    var dx = e.clientX - (b.left + R), dy = e.clientY - (b.top + R), d = Math.hypot(dx, dy), max = R * 0.62;
    if (d > max) { dx = dx / d * max; dy = dy / d * max; }
    knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    var nx = dx / max, ny = dy / max;
    // horizontal triggers early (walking is what matters); up/down need a firmer push so running never ducks or looks up
    dirs(nx < -0.3, nx > 0.3, ny < -0.55, ny > 0.55);
  }
  function release(e) {
    if (sid === null || (e && e.pointerId !== sid)) return;
    sid = null; stick.classList.remove('on'); knob.style.transform = ''; dirs(false, false, false, false);
  }
  stick.addEventListener('pointerdown', function (e) {
    e.preventDefault(); if (sid !== null) return;
    sid = e.pointerId; stick.classList.add('on');
    try { stick.setPointerCapture(e.pointerId); } catch (err) { /* fine */ }
    move(e);
  });
  stick.addEventListener('pointermove', function (e) { if (e.pointerId === sid) { e.preventDefault(); move(e); } });
  stick.addEventListener('pointerup', release);
  stick.addEventListener('pointercancel', release);
  stick.addEventListener('lostpointercapture', release);
  stick.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  window.addEventListener('blur', function () { release(); });
})();

    for (const e of L.ents) decay(e);
    decay(L.partner);
    for (const q of L.projs) { q.t = (q.t || 0) + dt; q.vy += (q.g || 0) * dt; q.x += q.vx * dt; q.y += q.vy * dt; }
    const fx = L.fx;
    for (let i = fx.length - 1; i >= 0; i--) {
      const q = fx[i]; q.life -= dt;
      if (q.life <= 0) { fx[i] = fx[fx.length - 1]; fx.pop(); continue; }
      if (q.k === 0 || q.k === 2) {
        q.vy += q.g * dt;
        if (q.drag) { const d = Math.exp(-q.drag * dt); q.vx *= d; q.vy *= d; }
        q.x += q.vx * dt; q.y += q.vy * dt;
        if (q.bounce && q.vy > 0 && L.solidAt(q.x, q.y + 1)) { q.vy *= -0.45; q.vx *= 0.7; q.y -= 1; }
      }
    }
    L.events.length = 0;
    if (!L.cam.frozen) L.updateCam(dt);
    // my state -> host, 30 times a second
    if ((coop.gTick = (coop.gTick || 0) + 1) % 2 === 0) {
      const d = deltaDump(coop.gs, 'me', p);
      if (d) send({ t: 'st', d, a: coop.fxAck });
      else if (coop.gTick % 30 === 0) send({ t: 'st', d: {}, a: coop.fxAck });
    }
  };

  // smoothing offsets applied only while drawing
  const oDraw = Level.prototype.draw;
  Level.prototype.draw = function (g) {
    if (!this.net) return oDraw.call(this, g);
    const objs = this.net === 'guest' ? this.ents.concat([this.partner]) : [this.partner];
    for (const o of objs) if (o && o._sm) for (const k in o._sm) o[k] += o._sm[k];
    try { return oDraw.call(this, g); } finally { for (const o of objs) if (o && o._sm) for (const k in o._sm) o[k] -= o._sm[k]; }
  };
  coop.drawPartner = (g, L, cx, cy) => {
    const q = L.partner;
    if (q.dead || q.gone) return;
    if (q.away) g.globalAlpha = 0.4;
    q.draw(g, cx, cy);
    g.globalAlpha = 1;
    const px = Math.round(q.x + q.w / 2) - cx, py = Math.round(q.y) - cy;
    G.text(g, q.away ? 'away' : L.net === 'host' ? 'P2' : 'P1', px, py - 9, L.net === 'host' ? '#9cc4ff' : '#ffb38a', { tiny: true, align: 'c' });
  };
  coop.drawPartnerHud = (ug, L, hudY, dy) => {
    const q = L.partner, S = G.SPR, on = L.net === 'host' ? G.tint(S.pip, '#6aa8ff') : S.pip;
    for (let i = 0; i < q.maxHp; i++) ug.drawImage(i < q.hp ? on : S.pipOff, 6 + i * 9, hudY + dy);
    if (q.dead) G.text(ug, 'down...', 6 + q.maxHp * 9 + 2, hudY + dy, '#8d8798', { tiny: true });
  };

  // ---------- connection ----------
  const wait = () => ({
    t: 0, isWait: true,
    update(dt) { this.t += dt; },
    draw(g, ug) {
      g.fillStyle = '#0d0a12'; g.fillRect(0, 0, W, H);
      G.text(ug, 'CO-OP', W / 2, H / 2 - 22, '#6aa8ff', { align: 'c', scale: 2 });
      G.text(ug, coop.hostOn ? 'waiting for the host to start a level' + '.'.repeat(1 + ((this.t * 2) | 0) % 3) : 'host is offline', W / 2, H / 2 + 2, '#fff3e4', { align: 'c' });
      G.text(ug, coop.ping ? 'ping ' + coop.ping + ' ms' : '', W / 2, H / 2 + 16, '#8d8798', { align: 'c', tiny: true });
    },
  });
  // short on-screen message ("host disconnected"), drawn over whatever scene is showing
  const drawNotice = (ug) => {
    const n = coop.notice; if (!n) return;
    const w = G.textW(n.text) + 16; ug.globalAlpha = Math.min(1, n.t * 3);
    G.panel(ug, Math.round((W - w) / 2), 26, w, 15, '#17131f', '#ffb3b3', '#0d0a12');
    G.text(ug, n.text, W / 2, 30, '#ffd9d9', { align: 'c' }); ug.globalAlpha = 1;
  };
  coop.waitScene = wait;
  // dropped fx messages must still be acknowledged, or the host would keep treating those fields as its own
  function qDrop(list) { for (const m of list) if (m.t === 'fx') coop.fxAck = Math.max(coop.fxAck, m.q); }
  function onMsg(m) {
    if (m.t === 'pg') { send({ t: 'po', ts: m.ts }); return; }
    if (m.t === 'po') { coop.ping = Math.round(performance.now() - m.ts); ui.render(); return; }
    if (coop.role === 'host') {
      if (m.t === 'peer') {
        coop.peer = !!m.on; ui.render();
        const sc = G.scene;
        if (m.on) { if (sc && sc.L && !sc.L.net) G.go(() => G.Scenes.play(sc.L.id, sc.L.def.boss ? null : sc.L.snapshot())); }
        else if (sc && sc.L && sc.L.net) coop.partnerLost(sc.L);
      } else if (m.t === 'st') { Object.assign(coop.rAll, m.d); coop.rAck = m.a || 0; coop.rHas = true; }
      else if (m.t === 'cr' || m.t === 'bt') coop.inbox.push(m);
      else if (m.t === 'full') { const L = G.scene && G.scene.L; if (L && L.net === 'host' && m.e === coop.epoch) { L._net = null; coop.kfNext = true; } }
      else if (m.t === 'pz') { const sc = G.scene; if (m.e === coop.epoch && sc && sc.pauseFor) sc.pauseFor(!!m.on, 'P2'); }
      else if (m.t === 'away') { const L = G.scene && G.scene.L; if (L && L.p2) L.p2.away = !!m.on; }
    } else {
      if (m.t === 'host') {
        coop.hostOn = !!m.on; ui.render();
        if (!m.on && G.scene && G.scene.L && G.scene.L.net === 'guest') { coop.kick = 'wait'; coop.say('host disconnected'); }
      }
      else if (m.t === 'start') { coop.q = coop.q.filter((x) => x.e >= m.e); coop.startMsg = m; coop.leaveMsg = false; }
      else if (m.t === 'hs') { const L = G.scene && G.scene.L; if (!L || L.net !== 'guest' || m.e >= L._ep) coop.hostState = m.hs; }
      else if (m.t === 'leave') { coop.q.length = 0; coop.leaveMsg = true; }
      else if (m.t === 's' || m.t === 'fx') {
        coop.q.push(m);
        if (coop.q.length > 400) { qDrop(coop.q.splice(0, coop.q.length - 400)); coop.needFull = true; }   // keep the newest, ask for a keyframe
      }
    }
  }
  coop.connect = (role, code) => {
    if (coop.ws) { try { coop.ws.close(); } catch (e) {} }
    coop.role = role; coop.open = false; coop.peer = false; coop.hostOn = false; coop.status = 'connecting...'; ui.render();
    const ws = coop.ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws?role=' + role + '&code=' + encodeURIComponent(code || ''));
    ws.onopen = () => {
      coop.open = true; coop.status = role === 'host' ? 'hosting' : 'connected'; ui.render();
      if (role === 'guest') G.go(() => wait(), { speed: 3 });
      coop.pgT = setInterval(() => send({ t: 'pg', ts: performance.now() }), 2000);
    };
    ws.onmessage = (ev) => { try { onMsg(JSON.parse(ev.data)); } catch (e) { console.error(e); } };
    ws.onclose = (ev) => {
      if (coop.ws !== ws) return;
      clearInterval(coop.pgT); coop.open = false; coop.peer = false; coop.ping = 0;
      coop.status = ev.code === 4001 ? 'wrong code' : ev.code === 4002 ? 'a host is already running' : ev.code === 4003 ? 'host is not online yet' : 'offline';
      const L = G.scene && G.scene.L;
      if (L && L.net === 'host') coop.partnerLost(L);
      else if (coop.role === 'guest') { if (L && L.net === 'guest') coop.kick = 'map'; else if (G.scene && G.scene.isWait) coop.kick = 'map'; coop.say('connection lost'); }
      coop.role = null; ui.render();
    };
  };
  coop.disconnect = () => {
    const w = coop.ws, L = G.scene && G.scene.L, wasGuest = coop.role === 'guest';
    coop.ws = null; if (w) w.close(); clearInterval(coop.pgT); coop.open = false; coop.peer = false;
    if (L && L.net === 'host') coop.partnerLost(L);
    else if (wasGuest && ((L && L.net === 'guest') || (G.scene && G.scene.isWait))) coop.kick = 'map';
    coop.role = null; coop.status = 'offline'; ui.render();
  };

  // a background tab stops rendering: tell the host, and resync from a keyframe when it comes back
  document.addEventListener('visibilitychange', () => {
    if (coop.role !== 'guest' || !coop.open) return;
    if (document.hidden) send({ t: 'away', on: true });
    else {
      const L = G.scene && G.scene.L;
      if (L && L.net === 'guest') { qDrop(coop.q); coop.q = coop.q.filter((m) => m.e > L._ep); coop.needFull = true; coop.lastFull = 0; }
      send({ t: 'away', on: false });
    }
  });
  const oStep = G.step;
  G.step = function (n, quiet) {
    if (coop.notice && (coop.notice.t -= n / 60) <= 0) coop.notice = null;
    if (coop.kick && !G.transitioning()) {
      const k = coop.kick; coop.kick = null;
      if (k === 'wait' && coop.open) G.go(() => wait(), { speed: 3.2 }); else G.go(() => G.Scenes.map(), { speed: 3.2 });
    }
    if (coop.role === 'guest' && coop.open && !G.transitioning()) {
      if (coop.startMsg) {
        const m = coop.startMsg; coop.startMsg = null; coop.tools = m.tools; coop.startEpoch = m.e || 0;
        G.go(() => { coop.building = true; try { return G.Scenes.play(m.id, m.snap); } finally { coop.building = false; } }, { speed: 3.2 });
      } else if (coop.leaveMsg) { coop.leaveMsg = false; if (G.scene.L) G.go(() => wait(), { speed: 3.2 }); }
    }
    return oStep.call(this, n, quiet);
  };
  const oSet = G.setScene;
  G.setScene = function (s) {
    const old = G.scene;
    if (s && s.draw && !s._cn) { const d = s.draw; s._cn = 1; s.draw = function (g, ug) { d.call(this, g, ug); drawNotice(ug); }; }
    oSet.call(this, s);
    if (coop.role === 'host' && coop.open && coop.peer) {
      if (s.L && s.L.net === 'host') send({ t: 'start', id: s.L.id, snap: s.L.snapshot(), tools: G.save.data.tools, e: coop.epoch });
      else if (old && old.L && !s.L) send({ t: 'leave' });
    }
  };

  // ---------- tiny overlay UI ----------
  const ui = {
    render() {
      if (!this.btn) return;
      const on = coop.open;
      this.btn.textContent = on ? '2P \u25CF' + (coop.ping ? ' ' + coop.ping : '') : '2P';
      this.btn.style.color = on ? (coop.role === 'host' && !coop.peer ? '#ffd27a' : '#7fe08a') : '#fff';
      let s = coop.status;
      if (coop.role === 'host' && on) s = coop.peer ? 'friend connected - pick a level' : 'waiting for your friend (give them the link and code)';
      if (coop.role === 'guest' && on) s = coop.hostOn ? 'connected to host' : 'host is not online yet';
      this.stat.textContent = s;
      this.hostRow.style.display = on ? 'none' : '';
      this.codeBox.style.display = on && coop.role === 'host' ? '' : 'none';
      this.off.style.display = on ? '' : 'none';
    },
  };
  if (/^https?:$/.test(location.protocol)) {
    const css = document.createElement('style');
    css.textContent = '#coopBtn{position:fixed;top:6px;left:6px;z-index:60;font:bold 12px monospace;padding:4px 8px;background:rgba(20,16,30,.75);border:1px solid #555;border-radius:6px;opacity:.75}#coopBtn:hover{opacity:1}#coopP{position:fixed;top:34px;left:6px;z-index:60;width:230px;padding:10px;background:#17131f;color:#fff3e4;border:1px solid #6aa8ff;border-radius:8px;font:12px monospace;display:none}#coopP button,#coopP input{font:12px monospace;margin:3px 2px;padding:5px 8px;border-radius:5px;border:1px solid #555;background:#2a2338;color:#fff}#coopP input{width:70px}';
    document.head.appendChild(css);
    const btn = document.createElement('button'); btn.id = 'coopBtn'; btn.textContent = '2P'; btn.style.color = '#fff';
    const panel = document.createElement('div'); panel.id = 'coopP';
    panel.innerHTML = '<div style="color:#6aa8ff;font-weight:bold">CO-OP (2 players)</div><div id="cStat" style="margin:6px 0;color:#bbb">offline</div>' +
      '<div id="cRow"><button id="cHost">Host</button> <span>or</span><br><input id="cCode" placeholder="code" maxlength="6" inputmode="numeric"><button id="cJoin">Join</button></div>' +
      '<div id="cInfo" style="display:none;margin:4px 0">code: <b id="cShow" style="color:#ffd27a;font-size:16px"></b></div><button id="cOff" style="display:none">Disconnect</button>';
    document.body.appendChild(btn); document.body.appendChild(panel);
    ui.btn = btn; ui.stat = panel.querySelector('#cStat'); ui.hostRow = panel.querySelector('#cRow'); ui.codeBox = panel.querySelector('#cInfo'); ui.off = panel.querySelector('#cOff');
    for (const el of [btn, panel]) for (const ev of ['keydown', 'keyup', 'pointerdown']) el.addEventListener(ev, (e) => e.stopPropagation());
    btn.addEventListener('click', () => { panel.style.display = panel.style.display === 'block' ? 'none' : 'block'; });
    const host = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    panel.querySelector('#cHost').style.display = host ? '' : 'none';
    panel.querySelector('#cHost').addEventListener('click', () => {
      fetch('/code').then((r) => r.text()).then((c) => { panel.querySelector('#cShow').textContent = c; coop.connect('host', c); });
    });
    panel.querySelector('#cJoin').addEventListener('click', () => coop.connect('guest', panel.querySelector('#cCode').value.trim()));
    ui.off.addEventListener('click', () => coop.disconnect());
    if (!host) { panel.style.display = 'block'; }
    ui.render();
  }
})();

</script>
</body></html>
