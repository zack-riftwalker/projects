<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>CLAWD</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: #0d0a12;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script>
// If the game does not start (black screen), show what the browser said, so a phone screenshot is enough to find the problem.
(function () {
	var lines = [], box = null, started = false;
	function add(t) { lines.push(String(t)); if (lines.length > 40) lines.shift(); if (box) box.textContent = lines.join('\n'); }
	['log', 'warn', 'error'].forEach(function (k) { var o = console[k]; console[k] = function () { var t = Array.prototype.join.call(arguments, ' '); if (/CLAWD: ready/.test(t)) started = true; add(k + ': ' + t); return o.apply(console, arguments); }; });
	window.addEventListener('error', function (e) { add('ERROR: ' + e.message + ' ' + (e.filename || '') + ':' + (e.lineno || '')); });
	window.addEventListener('unhandledrejection', function (e) { add('REJECTED: ' + (e.reason && (e.reason.message || e.reason))); });
	try {
		var gl = document.createElement('canvas').getContext('webgl2');
		var di = gl && gl.getExtension('WEBGL_debug_renderer_info');
		add('webgl2: ' + (gl ? 'yes ' + (di ? gl.getParameter(di.UNMASKED_RENDERER_WEBGL) : '') : 'NO'));
	} catch (e) { add('webgl2 check failed: ' + e.message); }
	add('secure context: ' + window.isSecureContext + ' | ' + navigator.userAgent);
	setTimeout(function () {
		if (started && !/[?&]log\b/.test(location.search)) return;
		box = document.createElement('pre');
		box.style.cssText = 'position:fixed;left:0;right:0;top:0;margin:0;padding:6px;z-index:9999;color:#fff;background:rgba(0,0,0,0.75);font:11px/1.3 monospace;white-space:pre-wrap;word-break:break-all;pointer-events:none;max-height:60vh;overflow:hidden';
		box.textContent = (started ? '' : 'CLAWD did not start - send a screenshot of this text\n') + lines.join('\n');
		document.body.appendChild(box);
	}, 8000);
})();
</script>
<script>
// Plain http on a LAN or public IP (how the friend joins the PC) is not a "secure context":
// browsers hide AudioWorklet there and Godot refuses to start. Use the ScriptProcessor audio driver instead
// and give Godot a do-nothing addModule for its sample-position worklet. Verified 2026-10-09 (Chromium).
if (!window.isSecureContext && window.AudioContext && !('audioWorklet' in AudioContext.prototype)) {
	Object.defineProperty(AudioContext.prototype, 'audioWorklet', { get() { return { addModule: () => Promise.resolve() }; } });
	window.CLAWD_INSECURE = true;
}
</script>
<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":3951916,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
if (window.CLAWD_INSECURE) GODOT_CONFIG['args'] = (GODOT_CONFIG['args'] || []).concat(['--audio-driver', 'ScriptProcessor']);
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (window.CLAWD_INSECURE) missing.splice(0, missing.length, ...missing.filter((m) => !m.startsWith('Secure Context')));
	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
